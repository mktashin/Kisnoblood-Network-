<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kisno Blood Network</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Tiro+Bangla&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --red:#e53935;--red-d:#b71c1c;--red-ghost:rgba(229,57,53,.09);
  --white:#fff;--off:#fdf7f7;--cream:#fff9f9;
  --ink:#1c1212;--soft:#4a3535;--muted:#8a7070;--border:#eedddd;
  --nav:68px;
}
html{scroll-behavior:smooth}
body{font-family:'Hind Siliguri',sans-serif;background:var(--off);color:var(--ink);overflow-x:hidden}

/* NAV */
nav{position:fixed;top:0;left:0;right:0;z-index:999;height:var(--nav);display:flex;align-items:center;background:rgba(253,247,247,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.nav-c{width:100%;max-width:1100px;margin:0 auto;padding:0 24px;display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:'Tiro Bangla',serif;font-size:1.1rem;font-weight:700;color:var(--red)}
.logo-drop{width:32px;height:32px;min-width:32px;border-radius:50% 50% 50% 0;background:var(--red);transform:rotate(-45deg);animation:pulse 2s infinite;box-shadow:0 0 0 0 rgba(229,57,53,.3)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(229,57,53,.3)}50%{box-shadow:0 0 0 10px transparent}}
.nav-links{display:flex;align-items:center;gap:4px;list-style:none}
.nav-links a{text-decoration:none;font-size:.88rem;font-weight:600;color:var(--soft);padding:8px 14px;border-radius:100px;transition:.2s;cursor:pointer}
.nav-links a:hover,.nav-links a.active{color:var(--red);background:var(--red-ghost)}
.nav-links .ncta a{background:var(--red);color:#fff!important;box-shadow:0 3px 12px rgba(229,57,53,.3)}
.nav-links .ncta a:hover{background:var(--red-d)}
.burger{display:none;flex-direction:column;gap:5px;cursor:pointer;padding:4px}
.burger span{width:22px;height:2px;background:var(--ink);border-radius:2px;transition:.3s}
.burger.open span:nth-child(1){transform:translateY(7px) rotate(45deg)}
.burger.open span:nth-child(2){opacity:0}
.burger.open span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
.drawer{display:none;position:fixed;inset:0;z-index:998;background:#fff;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.drawer.open{display:flex}
.drawer a{font-size:1.25rem;font-weight:700;color:var(--ink);text-decoration:none;padding:14px 48px;border-radius:14px;transition:.2s;cursor:pointer}
.drawer a:hover{background:var(--red-ghost);color:var(--red)}
.drawer .dcta{background:var(--red);color:#fff!important;margin-top:8px;box-shadow:0 4px 16px rgba(229,57,53,.3)}

/* PAGES */
.page{display:none;padding-top:var(--nav);min-height:100vh}
.page.active{display:block}

/* LAYOUT UTILS */
.wrap{max-width:1100px;margin:0 auto;padding:0 24px}
.sec{padding:80px 0}
.sec-alt{background:var(--cream)}
.tag{display:inline-flex;align-items:center;gap:8px;font-size:.72rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--red);margin-bottom:12px}
.tag::before{content:'';width:16px;height:2px;background:var(--red);border-radius:2px}
.sec-h{font-family:'Tiro Bangla',serif;font-size:clamp(1.8rem,4vw,2.5rem);line-height:1.2;margin-bottom:10px}
.sec-p{color:var(--muted);font-size:.97rem;line-height:1.7;max-width:500px;margin-bottom:44px}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:8px;padding:14px 28px;border-radius:100px;font-family:'Hind Siliguri',sans-serif;font-size:.97rem;font-weight:700;cursor:pointer;transition:.22s;border:none;text-decoration:none}
.btn-red{background:var(--red);color:#fff;box-shadow:0 4px 18px rgba(229,57,53,.3)}
.btn-red:hover{background:var(--red-d);transform:translateY(-2px);box-shadow:0 8px 28px rgba(229,57,53,.4)}
.btn-ghost{background:transparent;color:var(--red);border:2px solid var(--red)}
.btn-ghost:hover{background:var(--red);color:#fff;transform:translateY(-2px)}

/* FORMS */
.iw{margin-bottom:16px}
.iw label{display:block;font-size:.82rem;font-weight:600;color:var(--soft);margin-bottom:6px}
.iw input,.iw select,.iw textarea{width:100%;padding:13px 16px;border:1.5px solid var(--border);border-radius:10px;font-family:'Hind Siliguri',sans-serif;font-size:.95rem;color:var(--ink);background:var(--cream);transition:.2s;appearance:none;-webkit-appearance:none}
.iw input:focus,.iw select:focus,.iw textarea:focus{outline:none;border-color:var(--red);box-shadow:0 0 0 3px rgba(229,57,53,.09);background:#fff}
.iw textarea{resize:vertical;min-height:80px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:560px){.frow{grid-template-columns:1fr}}

/* CARDS */
.card{background:#fff;border-radius:18px;border:1.5px solid var(--border);padding:24px;transition:.25s;box-shadow:0 2px 8px rgba(229,57,53,.05)}
.card:hover{transform:translateY(-3px);box-shadow:0 8px 28px rgba(229,57,53,.12);border-color:rgba(229,57,53,.25)}

/* BLOOD BADGE */
.bb{width:52px;height:52px;min-width:52px;border-radius:50% 50% 50% 0;background:var(--red);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:.95rem;box-shadow:0 3px 12px rgba(229,57,53,.3)}

/* ===================== HERO ===================== */
.hero{min-height:calc(100vh - var(--nav));display:flex;align-items:center;position:relative;overflow:hidden}
.hero-glow{position:absolute;right:-100px;top:50%;transform:translateY(-50%);width:600px;height:600px;background:radial-gradient(ellipse,rgba(229,57,53,.11) 0%,transparent 70%);pointer-events:none}
.hero-ring{position:absolute;border-radius:50%;border:1px solid rgba(229,57,53,.08);pointer-events:none}
.hero-ring:nth-child(2){width:480px;height:480px;top:-160px;right:-120px}
.hero-ring:nth-child(3){width:280px;height:280px;bottom:5%;right:12%}

.hero-grid{display:grid;grid-template-columns:1fr 1fr;gap:64px;align-items:center;padding:80px 0;position:relative;z-index:2}
.hpill{display:inline-flex;align-items:center;gap:8px;background:var(--red-ghost);border:1px solid rgba(229,57,53,.2);border-radius:100px;padding:6px 16px;font-size:.72rem;font-weight:700;color:var(--red);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:22px}
.ldot{width:8px;height:8px;border-radius:50%;background:var(--red);animation:blink 1.8s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.hero-h1{font-family:'Tiro Bangla',serif;font-size:clamp(2.2rem,5vw,3.6rem);line-height:1.12;margin-bottom:20px}
.hero-h1 span{color:var(--red)}
.hero-p{font-size:1.02rem;color:var(--soft);line-height:1.75;margin-bottom:36px;max-width:440px}
.hero-btns{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:44px}
.hero-stats{display:flex;gap:32px;flex-wrap:wrap}
.hstat-n{font-family:'Tiro Bangla',serif;font-size:1.8rem;font-weight:700;color:var(--red);line-height:1}
.hstat-l{font-size:.78rem;color:var(--muted);margin-top:2px}

/* Search Card */
.search-card{background:#fff;border-radius:24px;padding:32px;box-shadow:0 12px 48px rgba(229,57,53,.15);border:1px solid var(--border);position:relative;overflow:hidden}
.search-card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--red),#ff6b6b)}
.search-card h3{font-size:1.05rem;font-weight:700;margin-bottom:22px;display:flex;align-items:center;gap:8px}
.search-btn-full{width:100%;padding:14px;background:var(--red);color:#fff;border:none;border-radius:10px;font-size:1rem;font-weight:700;font-family:'Hind Siliguri',sans-serif;cursor:pointer;transition:.22s;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 4px 16px rgba(229,57,53,.3);margin-top:8px}
.search-btn-full:hover{background:var(--red-d);transform:translateY(-1px);box-shadow:0 6px 24px rgba(229,57,53,.4)}

/* STATS BAR */
.stats-bar{background:var(--red);padding:36px 0}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;text-align:center}
.stat-n{font-family:'Tiro Bangla',serif;font-size:2.2rem;font-weight:700;color:#fff;line-height:1;display:block}
.stat-l{font-size:.82rem;color:rgba(255,255,255,.8);margin-top:4px}

/* HOW IT WORKS */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
.step{padding:32px;border-radius:20px;background:var(--cream);border:1.5px solid var(--border);transition:.25s;position:relative;overflow:hidden}
.step:hover{transform:translateY(-4px);box-shadow:0 8px 28px rgba(229,57,53,.1);border-color:rgba(229,57,53,.2)}
.step-n{font-family:'Tiro Bangla',serif;font-size:3rem;color:rgba(229,57,53,.1);line-height:1;margin-bottom:12px}
.step-icon{font-size:1.8rem;margin-bottom:14px;display:block}
.step h4{font-size:1rem;font-weight:700;margin-bottom:10px}
.step p{font-size:.88rem;color:var(--muted);line-height:1.65}

/* REQUESTS */
.req-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}
.req-card{background:#fff;border-radius:18px;padding:20px;border:1.5px solid var(--border);transition:.25s;cursor:pointer}
.req-card:hover{border-color:var(--red);box-shadow:0 8px 24px rgba(229,57,53,.12);transform:translateY(-2px)}
.req-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px}
.ubadge{background:var(--red);color:#fff;font-size:.68rem;font-weight:700;padding:4px 10px;border-radius:100px;text-transform:uppercase;letter-spacing:.8px;animation:blink 1.5s infinite}
.nbadge{background:#f5f5f5;color:#888;font-size:.68rem;font-weight:600;padding:4px 10px;border-radius:100px}
.req-card h4{font-size:.95rem;font-weight:700;margin-bottom:8px}
.req-meta{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.req-meta span{font-size:.82rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.call-btn{width:100%;padding:11px;background:var(--red-ghost);border:1.5px solid rgba(229,57,53,.2);border-radius:10px;color:var(--red);font-size:.9rem;font-weight:700;font-family:'Hind Siliguri',sans-serif;cursor:pointer;transition:.2s;display:flex;align-items:center;justify-content:center;gap:6px}
.call-btn:hover{background:var(--red);color:#fff}

/* DONOR CARDS */
.donor-list{display:flex;flex-direction:column;gap:12px}
.donor-card{display:flex;align-items:center;gap:16px;background:#fff;border:1.5px solid var(--border);border-radius:14px;padding:16px 20px;transition:.2s;cursor:pointer}
.donor-card:hover{border-color:var(--red);box-shadow:0 4px 16px rgba(229,57,53,.1);transform:translateX(4px)}
.di{flex:1}
.di h5{font-size:.95rem;font-weight:700;margin-bottom:4px}
.di p{font-size:.8rem;color:var(--muted)}
.donor-call{background:var(--red);color:#fff;border:none;border-radius:8px;padding:9px 18px;font-size:.85rem;font-weight:700;font-family:'Hind Siliguri',sans-serif;cursor:pointer;transition:.2s;white-space:nowrap}
.donor-call:hover{background:var(--red-d)}
.no-results{text-align:center;padding:60px 20px;color:var(--muted)}
.no-results .big{font-size:3rem;display:block;margin-bottom:12px}

/* REGISTER PAGE */
.reg-grid{display:grid;grid-template-columns:1fr 1fr;gap:60px;align-items:center}
.reg-visual{background:linear-gradient(135deg,var(--red),var(--red-d));border-radius:24px;padding:48px;color:#fff;position:relative;overflow:hidden}
.reg-visual::before{content:'';position:absolute;width:220px;height:220px;border-radius:50% 50% 50% 0;border:45px solid rgba(255,255,255,.07);top:-70px;right:-70px;transform:rotate(-45deg)}
.reg-visual::after{content:'';position:absolute;width:140px;height:140px;border-radius:50% 50% 50% 0;border:35px solid rgba(255,255,255,.05);bottom:-35px;left:20px;transform:rotate(-45deg)}
.reg-visual h3{font-family:'Tiro Bangla',serif;font-size:1.9rem;margin-bottom:16px;position:relative;z-index:1}
.reg-visual p{opacity:.85;line-height:1.7;font-size:.95rem;position:relative;z-index:1;margin-bottom:28px}
.rv-list{list-style:none;position:relative;z-index:1;display:flex;flex-direction:column;gap:12px}
.rv-list li{display:flex;align-items:center;gap:12px;font-size:.9rem;opacity:.9}
.rv-list li::before{content:'✓';width:24px;height:24px;min-width:24px;background:rgba(255,255,255,.2);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700}

/* TOGGLE */
.toggle-wrap{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.toggle-wrap label{font-size:.88rem;font-weight:600;color:var(--soft)}
.toggle{width:48px;height:26px;background:#ddd;border-radius:100px;position:relative;cursor:pointer;transition:.3s;border:none;flex-shrink:0}
.toggle.on{background:var(--red)}
.toggle::after{content:'';position:absolute;width:20px;height:20px;background:#fff;border-radius:50%;top:3px;left:3px;transition:.3s;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.toggle.on::after{left:25px}

/* CONTACT */
.contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:start}
.contact-info{display:flex;flex-direction:column;gap:20px}
.ci-item{display:flex;align-items:center;gap:16px;padding:20px;background:#fff;border-radius:16px;border:1.5px solid var(--border);transition:.2s;text-decoration:none;color:var(--ink)}
.ci-item:hover{border-color:var(--red);box-shadow:0 4px 16px rgba(229,57,53,.1);transform:translateX(4px)}
.ci-icon{width:48px;height:48px;min-width:48px;border-radius:14px;background:var(--red-ghost);display:flex;align-items:center;justify-content:center;font-size:1.4rem}
.ci-item h5{font-size:.9rem;font-weight:700;margin-bottom:3px}
.ci-item p{font-size:.82rem;color:var(--muted)}

/* AWARENESS */
.aware-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.aware-card{background:#fff;border-radius:16px;padding:26px;border:1.5px solid var(--border);transition:.25s}
.aware-card:hover{transform:translateY(-3px);box-shadow:0 6px 22px rgba(229,57,53,.1);border-color:rgba(229,57,53,.2)}
.aware-icon{font-size:2rem;display:block;margin-bottom:12px}
.aware-card h4{font-size:.97rem;font-weight:700;margin-bottom:8px;color:var(--red)}
.aware-card p{font-size:.85rem;color:var(--muted);line-height:1.65}

/* MODAL */
.modal-bg{display:none;position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);align-items:center;justify-content:center;padding:20px}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:24px;padding:40px;max-width:480px;width:100%;position:relative;animation:slideUp .28s ease;max-height:90vh;overflow-y:auto}
@keyframes slideUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
.modal-x{position:absolute;top:16px;right:16px;width:32px;height:32px;background:#f5f5f5;border:none;border-radius:50%;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;transition:.2s}
.modal-x:hover{background:var(--red);color:#fff}
.modal h3{font-family:'Tiro Bangla',serif;font-size:1.45rem;margin-bottom:6px}
.modal .msub{color:var(--muted);font-size:.88rem;margin-bottom:22px}

/* TOAST */
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 26px;border-radius:100px;font-size:.9rem;font-weight:500;z-index:9999;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}

/* WHATSAPP FLOAT */
.wa-float{position:fixed;bottom:24px;right:24px;z-index:800;display:none}
.wa-float a{width:56px;height:56px;background:#25D366;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:1.6rem;text-decoration:none;box-shadow:0 4px 20px rgba(37,211,102,.4);animation:wabounce 2s ease-in-out infinite}
@keyframes wabounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}

/* FOOTER */
footer{background:#1c1212;color:#fff;padding:56px 0 28px}
.footer-grid{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:40px;margin-bottom:44px}
.fb h4{font-family:'Tiro Bangla',serif;font-size:1.1rem;color:#fff;margin-bottom:12px}
.fb p{font-size:.85rem;opacity:.55;line-height:1.7;margin-bottom:20px}
.socials{display:flex;gap:10px}
.socials a{width:36px;height:36px;background:rgba(255,255,255,.1);border-radius:10px;display:flex;align-items:center;justify-content:center;text-decoration:none;color:#fff;font-size:.9rem;transition:.2s}
.socials a:hover{background:var(--red);transform:translateY(-2px)}
.fc h5{font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;opacity:.4;margin-bottom:14px}
.fc ul{list-style:none;display:flex;flex-direction:column;gap:10px}
.fc ul a{color:rgba(255,255,255,.6);text-decoration:none;font-size:.87rem;transition:.2s;cursor:pointer}
.fc ul a:hover{color:#fff}
.footer-bottom{border-top:1px solid rgba(255,255,255,.08);padding-top:24px;display:flex;justify-content:space-between;align-items:center;font-size:.8rem;opacity:.4;flex-wrap:wrap;gap:8px}

/* SEARCH PAGE FILTERS */
.filter-bar{background:#fff;border-radius:var(--r-lg,16px);padding:28px;box-shadow:0 4px 20px rgba(229,57,53,.08);border:1.5px solid var(--border);margin-bottom:36px;display:grid;grid-template-columns:1fr 1fr auto;gap:16px;align-items:end}
.filter-bar .btn-red{padding:13px 28px}

/* RESULTS COUNT */
.results-info{margin-bottom:20px;font-size:.9rem;color:var(--muted);font-weight:500}
.results-info strong{color:var(--red)}

/* AVAILABILITY BADGE */
.avail-on{background:#e8f5e9;color:#388e3c;font-size:.72rem;font-weight:700;padding:3px 10px;border-radius:100px}
.avail-off{background:#fce4ec;color:#c62828;font-size:.72rem;font-weight:700;padding:3px 10px;border-radius:100px}

/* RESPONSIVE */
@media(max-width:900px){
  .hero-grid{grid-template-columns:1fr;gap:40px;padding:60px 0}
  .stats-grid{grid-template-columns:repeat(2,1fr)}
  .steps{grid-template-columns:1fr}
  .reg-grid{grid-template-columns:1fr}
  .contact-grid{grid-template-columns:1fr}
  .aware-grid{grid-template-columns:1fr 1fr}
  .footer-grid{grid-template-columns:1fr 1fr}
  .nav-links{display:none}
  .burger{display:flex}
  .wa-float{display:block}
  .filter-bar{grid-template-columns:1fr 1fr;gap:12px}
  .filter-bar .btn-red{grid-column:1/-1}
}
@media(max-width:600px){
  .aware-grid{grid-template-columns:1fr}
  .footer-grid{grid-template-columns:1fr}
  .hero-btns{flex-direction:column}
  .btn{justify-content:center}
  .sec{padding:56px 0}
  .stats-grid{grid-template-columns:1fr 1fr}
  .stat-n{font-size:1.8rem}
  .filter-bar{grid-template-columns:1fr}
  .footer-bottom{flex-direction:column;text-align:center}
  .modal{padding:28px 18px}
}

/* SCROLL REVEAL */
.rv{opacity:0;transform:translateY(22px);transition:opacity .55s ease,transform .55s ease}
.rv.in{opacity:1;transform:translateY(0)}
</style>
</head>
<body>

<!-- ========== NAV ========== -->
<nav>
  <div class="nav-c">
    <a class="logo" onclick="goPage('home')">
      <div class="logo-drop"></div>
      Kisno Blood Network
    </a>
    <ul class="nav-links">
      <li><a onclick="goPage('home')">হোম</a></li>
      <li><a onclick="goPage('search')">Donor খুঁজুন</a></li>
      <li><a onclick="goPage('requests')">রক্তের অনুরোধ</a></li>
      <li><a onclick="goPage('awareness')">সচেতনতা</a></li>
      <li><a onclick="goPage('contact')">যোগাযোগ</a></li>
      <li class="ncta"><a onclick="goPage('register')">Donor হন ❤️</a></li>
    </ul>
    <div class="burger" id="burger" onclick="toggleDrawer()">
      <span></span><span></span><span></span>
    </div>
  </div>
</nav>

<!-- Mobile Drawer -->
<div class="drawer" id="drawer">
  <a onclick="goPage('home');closeDrawer()">🏠 হোম</a>
  <a onclick="goPage('search');closeDrawer()">🔍 Donor খুঁজুন</a>
  <a onclick="goPage('requests');closeDrawer()">🩸 রক্তের অনুরোধ</a>
  <a onclick="goPage('awareness');closeDrawer()">💡 সচেতনতা</a>
  <a onclick="goPage('contact');closeDrawer()">📞 যোগাযোগ</a>
  <a class="dcta" onclick="goPage('register');closeDrawer()">❤️ Donor হন</a>
</div>

<!-- ========== HOME PAGE ========== -->
<div class="page active" id="pg-home">

  <!-- HERO -->
  <section class="hero">
    <div class="hero-glow"></div>
    <div
